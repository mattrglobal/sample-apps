name: Weekly dependency refresh

# Re-resolves every app's lockfile to the newest versions its package.json ranges allow,
# commits them to deps/weekly-refresh, and opens (or updates) a tracking issue with a
# one-click link to open the PR. The org doesn't let GITHUB_TOKEN open PRs.

on:
  schedule:
    # Monday 09:00 NZDT (08:00 NZST)
    - cron: "0 20 * * 0"
  workflow_dispatch:

concurrency:
  group: deps-weekly-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: write

jobs:
  refresh:
    if: github.repository == 'mattrglobal/sample-apps'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Refresh lockfiles
        id: refresh
        run: node scripts/deps/refresh.mjs --report "$RUNNER_TEMP/deps-report.md"

      - name: Commit lockfiles and update the tracking issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REFRESH_ASSIGNEES: avner-m
          REFRESH_MENTIONS: "@avner-m @mattrglobal/labs-engs"
        run: node scripts/deps/publish.mjs --report "$RUNNER_TEMP/deps-report.md" --changed "${{ steps.refresh.outputs.changed }}"
